# Render Blueprint: the CraveQ API, its background worker, and Redis.
# The two websites (Client, client-restraurant) are deployed separately on Vercel.
# Render → New → Blueprint → pick this repo. It asks for every `sync: false` value.

envVarGroups:
  - name: craveq-secrets
    envVars:
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The two Vercel URLs, e.g. https://craveq.vercel.app — used for email links
      # and to accept requests coming from those sites.
      - key: CUSTOMER_APP_URL
        sync: false
      - key: DASHBOARD_APP_URL
        sync: false

services:
  - type: web
    name: craveq-api
    runtime: node
    rootDir: Server
    plan: starter # free instances sleep when idle, which drops live notifications
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod # applies pending migrations, then starts the API
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Requests arrive via Vercel's proxy and then Render's: trust both hops for the visitor's IP.
      - key: TRUST_PROXY
        value: "2"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: craveq-redis
          property: connectionString
      - fromGroup: craveq-secrets

  # Reminders, auto-start cooking and order expiry. Must always be running.
  - type: worker
    name: craveq-worker
    runtime: node
    rootDir: Server
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: craveq-redis
          property: connectionString
      - fromGroup: craveq-secrets

  - type: keyvalue
    name: craveq-redis
    plan: starter # the free plan doesn't persist, so scheduled reminders could be lost on restart
    maxmemoryPolicy: noeviction # the job queue must never have keys evicted
    ipAllowList: [] # reachable only from the services above
